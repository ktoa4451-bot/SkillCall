<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillCall — видеозвонки для учёбы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f7fb;--ink:#14213d;--mute:#5d6b86;--line:#dbe1ee;--blue:#3d3df5;--blue2:#2b2bc9;--mark:#ffd23f;--bad:#d8344a;--night:#0e1630;--night2:#1a2547;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Onest,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;background:var(--blue);color:#fff;transition:background .15s}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
input:focus{border-color:var(--blue);outline:0}
.err{color:var(--bad);font-size:14px;min-height:21px}
/* auth */
#auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--night);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.logo{font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.logo b{width:14px;height:14px;border-radius:50%;background:var(--mark)}
.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.05;font-weight:800;letter-spacing:-.02em;max-width:11em}
.hero p{color:#aab6d6;max-width:30em;margin-top:18px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px}
.mini div{aspect-ratio:4/3;border-radius:12px;background:var(--night2);position:relative}
.mini div:nth-child(2){outline:3px solid var(--mark)}
.mini div::after{content:"";position:absolute;left:50%;top:38%;width:30%;aspect-ratio:1;border-radius:50%;background:#34447a;transform:translateX(-50%)}
.authbox{display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:100%;max-width:380px;display:grid;gap:12px}
.card h2{font-size:28px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:#e8ecf5;border-radius:12px;padding:4px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--mute)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink)}
/* lobby */
#lobby{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--line);background:#fff}
.who{display:flex;align-items:center;gap:12px;font-weight:500}
.lob{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:48px;max-width:1100px;width:100%;margin:0 auto;padding:40px 28px;align-items:center}
.prev{position:relative;aspect-ratio:16/10;background:var(--night);border-radius:20px;overflow:hidden}
.prev video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.prev .ctl{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.act{display:grid;gap:14px}
.act h2{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.row{display:flex;gap:8px}
.or{color:var(--mute);font-size:14px}
/* call */
#call{height:100%;display:flex;background:var(--night);color:#fff;overflow:hidden}
.stage{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));gap:12px}
.code{display:flex;align-items:center;gap:8px;background:var(--night2);padding:7px 12px;border-radius:10px;font-weight:500;font-size:14px}
.grid{flex:1;display:grid;gap:10px;padding:0 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));grid-auto-rows:1fr;min-height:0;overflow:auto}
.tile{position:relative;background:var(--night2);border-radius:var(--r);overflow:hidden;min-height:160px}
.tile video{width:100%;height:100%;object-fit:cover;background:#000}
.tile.me video:not(.scr){transform:scaleX(-1)}
.tile video.scr{object-fit:contain}
.tile .nm{position:absolute;left:10px;bottom:10px;background:rgba(14,22,48,.78);padding:3px 10px;border-radius:8px;font-size:13px;display:flex;gap:6px;align-items:center}
.tile .nm svg{width:14px;height:14px;color:#ff7b8d}
.tile .av{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.tile.nocam .av{display:flex}
.tile.nocam video{visibility:hidden}
.av span{width:84px;height:84px;border-radius:50%;background:#34447a;display:grid;place-items:center;font-size:34px;font-weight:800}
.tile .hd{position:absolute;top:10px;right:10px;background:var(--mark);color:var(--ink);border-radius:10px;padding:5px;display:none}
.tile.hand .hd{display:block}
.tile.hand{outline:3px solid var(--mark)}
.dock{display:flex;justify-content:center;gap:10px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.cb{width:52px;height:52px;border-radius:50%;background:var(--night2);color:#fff;display:grid;place-items:center;transition:background .15s}
.cb:hover{background:#2a3868}
.cb.off{background:var(--bad)}
.cb.on{background:var(--mark);color:var(--ink)}
.cb.end{background:var(--bad);width:72px;border-radius:26px}
.cb.end svg{transform:rotate(135deg)}
.prev .cb{background:rgba(14,22,48,.8)}
.chat{width:340px;background:#fff;color:var(--ink);display:flex;flex-direction:column}
.chat h3{padding:16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.m b{font-size:13px;color:var(--blue)}
.m p{word-break:break-word}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.send .btn{padding:10px 14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
@media(max-width:820px){
#auth,.lob{grid-template-columns:1fr}.hero{padding:28px}.mini{display:none}.lob{gap:24px;padding:20px 16px}
.chat{position:fixed;inset:0;width:100%;z-index:5}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth" class="hide">
  <div class="hero">
    <div class="logo"><b></b>SkillCall</div>
    <div><h1>Занятие начинается по ссылке</h1><p>Видеозвонки для учёбы: уроки, консультации и группы. Без установки программ, достаточно браузера.</p></div>
    <div class="mini"><div></div><div></div><div></div></div>
  </div>
  <div class="authbox">
    <form class="card" id="af" novalidate>
      <h2 id="at">Вход</h2>
      <div class="tabs" role="tablist"><button type="button" role="tab" id="t-in" aria-selected="true">Вход</button><button type="button" role="tab" id="t-up" aria-selected="false">Регистрация</button></div>
      <input id="an" placeholder="Ваше имя" autocomplete="name" class="hide">
      <input id="ae" type="email" placeholder="Электронная почта" autocomplete="email" required>
      <input id="ap" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="current-password" required>
      <div class="err" id="aerr" role="alert"></div>
      <button class="btn" id="asub">Войти</button>
    </form>
  </div>
</section>

<section id="lobby" class="hide">
  <header class="top">
    <div class="logo"><b style="background:var(--blue)"></b>SkillCall</div>
    <div class="who"><span id="lname"></span><button class="btn ghost" id="lout" style="padding:8px 14px">Выйти</button></div>
  </header>
  <main class="lob">
    <div class="prev"><video id="pv" autoplay muted playsinline></video>
      <div class="ctl"><button class="cb" id="pm" aria-label="Микрофон"></button><button class="cb" id="pc" aria-label="Камера"></button></div></div>
    <div class="act">
      <h2>Начните занятие или подключитесь к нему</h2>
      <button class="btn" id="mk">Создать встречу</button>
      <span class="or">или введите код встречи</span>
      <div class="row"><input id="jc" placeholder="abc-defg-hij" autocapitalize="off" autocomplete="off"><button class="btn ghost" id="jb">Войти</button></div>
      <div class="err" id="lerr" role="alert"></div>
    </div>
  </main>
</section>

<section id="call" class="hide">
  <div class="stage">
    <div class="bar"><div class="logo"><b></b>SkillCall</div>
      <button class="code" id="cp" title="Скопировать ссылку"><span id="rc"></span></button></div>
    <div class="grid" id="grid"></div>
    <div class="dock">
      <button class="cb" id="bm" aria-label="Микрофон"></button>
      <button class="cb" id="bc" aria-label="Камера"></button>
      <button class="cb" id="bs" aria-label="Показать экран"></button>
      <button class="cb" id="bh" aria-label="Поднять руку"></button>
      <button class="cb" id="bt" aria-label="Чат"></button>
      <button class="cb end" id="be" aria-label="Выйти из встречи"></button>
    </div>
  </div>
  <aside class="chat hide" id="chat">
    <h3>Чат встречи</h3>
    <div class="msgs" id="msgs"></div>
    <form class="send" id="sf"><input id="si" placeholder="Сообщение" autocomplete="off"><button class="btn" aria-label="Отправить"></button></form>
  </aside>
</section>

<script>
/* Для надёжной связи добавьте свой TURN-сервер (coturn) */
const ICE = [{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}
  /* ,{urls:"turn:turn.example.com:3478",username:"user",credential:"pass"} */];
const $ = id => document.getElementById(id);
const P = {mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
 micoff:'<path d="M1 1l22 22"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.6"/><path d="M19 10v2a7 7 0 0 1-1.1 3.8M5 10v2a7 7 0 0 0 11.5 5.4M12 19v3"/>',
 cam:'<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
 camoff:'<path d="M1 1l22 22"/><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.7 0H14a2 2 0 0 1 2 2v3.3l1 1L23 7v10"/>',
 scr:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
 chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 hand:'<path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.5 0-4-1-5.7-2.7L3.4 15.4a2 2 0 0 1 3-2.6L8 14"/>',
 end:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.800.7a2 2 0 0 1 1.700 2z"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const show = id => ['auth','lobby','call'].forEach(s => $(s).classList.toggle('hide', s !== id));
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2200); };
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- иконки в кнопках ---------- */
$('bs').innerHTML = ic('scr'); $('bh').innerHTML = ic('hand'); $('bt').innerHTML = ic('chat');
$('be').innerHTML = ic('end'); $('cp').insertAdjacentHTML('afterbegin', ic('copy')); $('sf').querySelector('.btn').innerHTML = ic('send');

/* ---------- связь с сервером ---------- */
async function api(p, body) {
  const r = await fetch('/api/' + p, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + (localStorage.tk || '')}, body: body && JSON.stringify(body)});
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Ошибка сервера. Попробуйте ещё раз.'); return d;
}

/* ---------- вход и регистрация ---------- */
let signup = false;
function mode(up) { signup = up; $('t-in').setAttribute('aria-selected', !up); $('t-up').setAttribute('aria-selected', up);
  $('an').classList.toggle('hide', !up); $('at').textContent = up ? 'Регистрация' : 'Вход'; $('asub').textContent = up ? 'Создать аккаунт' : 'Войти'; $('aerr').textContent = ''; }
$('t-in').onclick = () => mode(false); $('t-up').onclick = () => mode(true);
$('af').onsubmit = async e => { e.preventDefault(); $('aerr').textContent = '';
  try { const d = await api(signup ? 'register' : 'login', {name: $('an').value.trim(), email: $('ae').value.trim(), password: $('ap').value}); localStorage.tk = d.token; enterLobby(d.user); }
  catch (x) { $('aerr').textContent = x.message; } };
$('lout').onclick = () => { localStorage.removeItem('tk'); location.reload(); };

/* ---------- лобби ---------- */
let me, local, micOn = true, camOn = true, room = null;
function paintCtl() { $('pm').innerHTML = ic(micOn ? 'mic' : 'micoff'); $('pc').innerHTML = ic(camOn ? 'cam' : 'camoff'); $('pm').classList.toggle('off', !micOn); $('pc').classList.toggle('off', !camOn);
  $('bm').innerHTML = $('pm').innerHTML; $('bc').innerHTML = $('pc').innerHTML; $('bm').classList.toggle('off', !micOn); $('bc').classList.toggle('off', !camOn); }
async function enterLobby(u) { me = {uid: u.id, name: u.name}; $('lname').textContent = me.name; show('lobby'); paintCtl();
  const q = new URLSearchParams(location.search).get('room'); if (q) $('jc').value = q;
  if (!local) { try { local = await navigator.mediaDevices.getUserMedia({video: {width: 1280, height: 720}, audio: {echoCancellation: true, noiseSuppression: true}}); }
    catch { try { local = await navigator.mediaDevices.getUserMedia({audio: true}); camOn = false; } catch { $('lerr').textContent = 'Нет доступа к камере и микрофону. Разрешите его в настройках браузера.'; return; } } }
  $('pv').srcObject = local; applyTracks(); paintCtl(); }
function applyTracks() { if (!local) return; local.getAudioTracks().forEach(t => t.enabled = micOn); local.getVideoTracks().forEach(t => t.enabled = camOn); }
const toggleMic = () => { micOn = !micOn; applyTracks(); paintCtl(); sync({mic: micOn}); };
const toggleCam = () => { camOn = !camOn; applyTracks(); paintCtl(); sync({cam: camOn}); };
$('pm').onclick = $('bm').onclick = toggleMic; $('pc').onclick = $('bc').onclick = toggleCam;
const rnd = n => Array.from({length: n}, () => 'abcdefghijkmnpqrstuvwxyz'[Math.random() * 24 | 0]).join('');
$('mk').onclick = () => join(`${rnd(3)}-${rnd(4)}-${rnd(3)}`);
$('jb').onclick = () => { const c = $('jc').value.trim().toLowerCase().replace(/.*room=/, ''); if (!/^[a-z]{3}-[a-z]{4}-[a-z]{3}$/.test(c)) return $('lerr').textContent = 'Код выглядит так: abc-defg-hij.'; join(c); };
$('jc').onkeydown = e => e.key === 'Enter' && $('jb').click();

/* ---------- встреча ---------- */
const peers = {}, roster = {}; let ws, hand = false, sharing = null;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
function sync(d) { if (!room) return; Object.assign(roster[me.uid], d); send({t: 'state', ...d}); paintTile(me.uid); }
function tile(uid) { let t = $('t-' + uid); if (t) return t; t = document.createElement('div'); t.id = 't-' + uid; t.className = 'tile' + (uid === me.uid ? ' me' : '');
  t.innerHTML = `<video autoplay playsinline ${uid === me.uid ? 'muted' : ''}></video><div class="av"><span></span></div><div class="nm"></div><div class="hd">${ic('hand')}</div>`; $('grid').append(t); return t; }
function paintTile(uid) { const r = roster[uid] || {}, t = tile(uid), mine = uid === me.uid;
  t.querySelector('.nm').innerHTML = (r.mic === false ? ic('micoff') : '') + esc(mine ? 'Вы' : (r.name || 'Участник')); t.querySelector('.av span').textContent = (r.name || '?')[0].toUpperCase();
  t.classList.toggle('nocam', r.cam === false && !(mine && sharing)); t.classList.toggle('hand', !!r.hand); }

function join(code) {
  if (!local) return toast('Сначала разрешите доступ к камере и микрофону.');
  $('lerr').textContent = '';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?token=' + encodeURIComponent(localStorage.tk || ''));
  ws.onopen = () => send({t: 'join', room: code, mic: micOn, cam: camOn});
  ws.onmessage = e => on(JSON.parse(e.data));
  ws.onclose = () => { if (room) { toast('Соединение потеряно. Зайдите во встречу снова.'); leave(); } else if (!$('lobby').classList.contains('hide') && !$('lerr').textContent) $('lerr').textContent = 'Не удалось подключиться к серверу. Войдите в аккаунт заново.'; };
}
function on(m) {
  if (m.t === 'full') { $('lerr').textContent = `В этой встрече уже ${m.max} участников. Это максимум для одной комнаты.`; return ws.close(); }
  if (m.t === 'welcome') { room = m.room; me.uid = m.id; history.replaceState(null, '', '?room=' + room); $('rc').textContent = room; show('call'); $('grid').innerHTML = '';
    roster[me.uid] = {name: me.name, mic: micOn, cam: camOn}; tile(me.uid).querySelector('video').srcObject = local; paintTile(me.uid);
    m.peers.forEach(p => { roster[p.id] = p; paintTile(p.id); peer(p.id, true); }); m.chat.forEach(addMsg); }
  else if (m.t === 'join') { roster[m.peer.id] = m.peer; paintTile(m.peer.id); }
  else if (m.t === 'state') { roster[m.id] = Object.assign(roster[m.id] || {}, m.s); paintTile(m.id); }
  else if (m.t === 'leave') drop(m.id);
  else if (m.t === 'sig') gotSignal(m);
  else if (m.t === 'chat') { addMsg(m); if (m.id !== me.uid && $('chat').classList.contains('hide')) { toast(m.name + ': ' + m.text.slice(0, 40)); $('bt').classList.add('on'); } }
}
function addMsg(m) { const e = document.createElement('div'); e.className = 'm'; e.innerHTML = `<b>${esc(m.name)}</b><p>${esc(m.text)}</p>`; $('msgs').append(e); $('msgs').scrollTop = 1e9; }
const sig = (to, kind, data) => send({t: 'sig', to, kind, data});
function peer(id, init) {
  const pc = new RTCPeerConnection({iceServers: ICE}), p = peers[id] = {pc, q: []};
  local.getAudioTracks().forEach(t => pc.addTrack(t, local)); const vt = sharing ? sharing.getVideoTracks()[0] : local.getVideoTracks()[0]; if (vt) pc.addTrack(vt, local);
  pc.ontrack = e => { const v = tile(id).querySelector('video'); if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0]; };
  pc.onicecandidate = e => e.candidate && sig(id, 'ice', e.candidate.toJSON());
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') toast('Связь с участником нестабильна. Для надёжности нужен TURN-сервер.'); };
  if (init) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => sig(id, 'offer', pc.localDescription));
  return p;
}
async function gotSignal(s) {
  let p = peers[s.from], d = s.data;
  if (s.kind === 'offer') { if (p) { p.pc.close(); delete peers[s.from]; } p = peer(s.from, false); await p.pc.setRemoteDescription(d); await flush(p);
    await p.pc.setLocalDescription(await p.pc.createAnswer()); sig(s.from, 'answer', p.pc.localDescription); }
  else if (!p) return;
  else if (s.kind === 'answer') { await p.pc.setRemoteDescription(d); await flush(p); }
  else if (p.pc.remoteDescription) p.pc.addIceCandidate(d).catch(() => {}); else p.q.push(d);
}
async function flush(p) { for (const c of p.q.splice(0)) await p.pc.addIceCandidate(c).catch(() => {}); }
function drop(id) { if (peers[id]) { peers[id].pc.close(); delete peers[id]; } delete roster[id]; const t = $('t-' + id); t && t.remove(); }

$('bs').onclick = async () => {
  if (sharing) return stopShare();
  try { sharing = await navigator.mediaDevices.getDisplayMedia({video: true}); } catch { return; }
  const tr = sharing.getVideoTracks()[0]; tr.onended = stopShare; swap(tr);
  const v = tile(me.uid).querySelector('video'); v.srcObject = sharing; v.classList.add('scr'); tile(me.uid).classList.remove('nocam'); $('bs').classList.add('on'); };
function stopShare() { if (!sharing) return; sharing.getTracks().forEach(t => t.stop()); sharing = null; swap(local.getVideoTracks()[0] || null);
  if (!room) return; const v = tile(me.uid).querySelector('video'); v.srcObject = local; v.classList.remove('scr'); paintTile(me.uid); $('bs').classList.remove('on'); }
function swap(tr) { Object.values(peers).forEach(p => { const s = p.pc.getSenders().find(x => x.track && x.track.kind === 'video') || p.pc.getSenders().find(x => !x.track);
  s ? s.replaceTrack(tr) : (tr && p.pc.addTrack(tr, local)); }); }
$('bh').onclick = () => { hand = !hand; $('bh').classList.toggle('on', hand); sync({hand}); };
$('bt').onclick = () => { $('chat').classList.toggle('hide'); $('bt').classList.remove('on'); };
$('sf').onsubmit = e => { e.preventDefault(); const text = $('si').value.trim(); if (text) { send({t: 'chat', text}); $('si').value = ''; } };
$('cp').onclick = () => { navigator.clipboard.writeText(location.origin + location.pathname + '?room=' + room).then(() => toast('Ссылка скопирована'), () => toast('Код встречи: ' + room)); };
function leave() {
  if (!room) return; const w = ws; room = null; ws = null; w && w.close(); stopShare(); Object.keys(peers).forEach(drop);
  for (const k in roster) delete roster[k]; hand = false; $('bh').classList.remove('on'); $('msgs').innerHTML = ''; $('chat').classList.add('hide'); $('grid').innerHTML = '';
  history.replaceState(null, '', location.pathname); show('lobby'); }
$('be').onclick = leave;

/* ---------- запуск ---------- */
if (localStorage.tk) api('me').then(d => enterLobby(d.user)).catch(() => { localStorage.removeItem('tk'); show('auth'); }); else show('auth');
</script>
