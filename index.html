<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillCall — Видеозвонки</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #1a1a1a; }
        #join-area { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { padding: 12px 24px; background: #0070f3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #005bb5; }
        #room-area { display: none; margin-top: 20px; }
        #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
        .video-container { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-container .name { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 4px; font-size: 14px; }
        #controls { margin-top: 16px; display: flex; gap: 8px; }
        .btn-off { background: #dc3545; }
        #status { margin-top: 12px; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>SkillCall</h1>
    <p>Видеозвонки без обрывов записи.</p>

    <div id="join-area">
        <label>Ваше имя</label>
        <input type="text" id="username" placeholder="Введите имя" value="Гость">
        <label>Название комнаты</label>
        <input type="text" id="roomname" placeholder="Например: skillcall-demo" value="skillcall-demo">
        <button onclick="joinRoom()">Войти в комнату</button>
        <p id="status"></p>
    </div>

    <div id="room-area">
        <div id="video-grid"></div>
        <div id="controls">
            <button id="mic-btn" onclick="toggleMic()">Микрофон вкл</button>
            <button id="cam-btn" onclick="toggleCam()">Камера вкл</button>
            <button class="btn-off" onclick="leaveRoom()">Выйти</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script>
        const TOKEN_SERVER_ID = 'skillcall-2heq34';
        let room = null;
        let localVideoTrack = null;
        let localAudioTrack = null;
        let micEnabled = true;
        let camEnabled = true;

        const statusEl = document.getElementById('status');
        const joinArea = document.getElementById('join-area');
        const roomArea = document.getElementById('room-area');
        const videoGrid = document.getElementById('video-grid');

        function setStatus(msg) { statusEl.textContent = msg; }

        async function joinRoom() {
            const username = document.getElementById('username').value.trim() || 'Гость';
            const roomName = document.getElementById('roomname').value.trim() || 'skillcall-demo';
            setStatus('Подключение...');

            try {
                const tokenSource = LivekitClient.TokenSource.developmentTokenServer(TOKEN_SERVER_ID);
                const { serverUrl, participantToken } = await tokenSource.fetch({ roomName });

                room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LivekitClient.Track.Kind.Video || track.kind === LivekitClient.Track.Kind.Audio) {
                        const el = track.attach();
                        addVideoElement(el, participant.identity, track.kind);
                    }
                });

                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                    removeEmptyContainers();
                });

                room.on(LivekitClient.RoomEvent.ParticipantDisconnected, () => {
                    setTimeout(removeEmptyContainers, 100);
                });

                await room.connect(serverUrl, participantToken);
                setStatus('Подключено');

                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);
                camEnabled = true;
                micEnabled = true;

                room.localParticipant.videoTrackPublications.forEach(pub => {
                    if (pub.videoTrack) {
                        const el = pub.videoTrack.attach();
                        addVideoElement(el, username + ' (вы)', 'video');
                    }
                });

                joinArea.style.display = 'none';
                roomArea.style.display = 'block';
            } catch (err) {
                console.error(err);
                setStatus('Ошибка: ' + err.message);
            }
        }

        function addVideoElement(trackElement, name, kind) {
            const container = document.createElement('div');
            container.className = 'video-container';
            container.dataset.name = name;

            if (kind === 'video' || kind === LivekitClient.Track.Kind.Video) {
                const nameEl = document.createElement('div');
                nameEl.className = 'name';
                nameEl.textContent = name;
                container.appendChild(trackElement);
                container.appendChild(nameEl);
            } else {
                container.appendChild(trackElement);
                container.style.display = 'none';
            }

            videoGrid.appendChild(container);
        }

        function removeEmptyContainers() {
            document.querySelectorAll('.video-container').forEach(c => {
                if (!c.querySelector('video, audio')) c.remove();
            });
        }

        async function toggleMic() {
            if (!room) return;
            micEnabled = !micEnabled;
            await room.localParticipant.setMicrophoneEnabled(micEnabled);
            document.getElementById('mic-btn').textContent = micEnabled ? 'Микрофон вкл' : 'Микрофон выкл';
            document.getElementById('mic-btn').classList.toggle('btn-off', !micEnabled);
        }

        async function toggleCam() {
            if (!room) return;
            camEnabled = !camEnabled;
            await room.localParticipant.setCameraEnabled(camEnabled);
            document.getElementById('cam-btn').textContent = camEnabled ? 'Камера вкл' : 'Камера выкл';
            document.getElementById('cam-btn').classList.toggle('btn-off', !camEnabled);
        }

        async function leaveRoom() {
            if (room) {
                await room.disconnect();
                room = null;
            }
            videoGrid.innerHTML = '';
            roomArea.style.display = 'none';
            joinArea.style.display = 'block';
            setStatus('');
        }
    </script>
</body>
</html>
