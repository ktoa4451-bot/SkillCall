<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillCall — видеоуроки</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--text:#14171c;--muted:#6a7381;--line:#e1e5eb;--accent:#2f6bff;--danger:#e5484d;--ok:#2fa56b;--tile:#1c1f25}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--surface:#181b21;--text:#eef0f4;--muted:#99a1ad;--line:#292d35;--tile:#242830}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hidden{display:none!important}
button,input,select{font:inherit;color:inherit}
.screen{min-height:100%}
.center{display:grid;place-items:center;padding:20px;min-height:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;width:min(460px,100%)}
h1{margin:0 0 4px;font-size:25px}h2{margin:0 0 12px;font-size:17px}
.sub{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;width:100%;margin-top:16px}
.btn.alt{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.sm{width:auto;margin:0;padding:7px 12px;font-size:13px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:10px 0 0}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);font-weight:600}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top b{flex:1}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.wrap{max-width:900px;margin:0 auto;padding:18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.wrap .card{width:auto}
.row{display:flex;gap:8px;align-items:center}
.lesson{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.lesson span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson code{color:var(--muted);font-size:13px}
#call{height:100vh;height:100dvh;display:flex;flex-direction:column}
main{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));grid-auto-rows:minmax(150px,1fr);overflow:auto;min-width:0}
.tile{position:relative;background:var(--tile);border-radius:16px;overflow:hidden;min-height:150px}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.me video{transform:scaleX(-1)}
.tile.sp{grid-column:1/-1;grid-row:span 2}
.tile.sp video{object-fit:contain;transform:none;background:#000}
.tile.nocam video{opacity:0}
.ava{position:absolute;inset:0;display:none;place-items:center}
.tile.nocam .ava{display:grid}
.ava i{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 32px system-ui;font-style:normal}
.nm{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.6);color:#fff;padding:3px 9px;border-radius:9px;font-size:13px}
.nm svg{display:block}
.hand{color:#ffc53d}.mut{color:#ff8589}
#side{width:310px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#side h2{padding:12px 14px 0}
#people{padding:6px 14px;font-size:14px;max-height:30%;overflow:auto}
#people div{padding:3px 0;display:flex;gap:6px;align-items:center}
#msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line)}
.m{background:var(--bg);padding:7px 10px;border-radius:12px;word-break:break-word}
.m small{display:block;color:var(--muted);font-size:12px}
#cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.bar{display:flex;justify-content:center;gap:10px;padding:10px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.cb{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.cb.off,.cb.end{background:var(--danger);border-color:var(--danger);color:#fff}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cb:disabled{opacity:.4;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90%}
#toast.show{opacity:1}
@media (max-width:760px){#side{position:fixed;inset:0;width:auto;z-index:5}}
</style>
</head>
<body>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<section id="auth" class="screen center hidden"><div class="card">
  <h1>SkillCall</h1><p class="sub">Видеоуроки, лекции и консультации онлайн</p>
  <div class="tabs"><button id="tL" class="on">Вход</button><button id="tR">Регистрация</button></div>
  <div id="regOnly" class="hidden">
    <label>Имя и фамилия</label><input id="aName" maxlength="40" autocomplete="name">
    <label>Я</label><select id="aRole"><option value="student">Студент</option><option value="teacher">Преподаватель</option></select>
  </div>
  <label>Email</label><input id="aMail" type="email" autocomplete="email">
  <label>Пароль (не короче 6 символов)</label><input id="aPass" type="password" autocomplete="current-password">
  <button class="btn" id="aGo">Войти</button><p class="err" id="aErr"></p>
</div></section>

<!-- ГЛАВНАЯ -->
<section id="home" class="screen hidden">
  <div class="top"><b>SkillCall</b><span class="tag" id="roleTag"></span><span id="hi"></span>
    <button class="btn alt sm" id="out">Выйти</button></div>
  <div class="wrap">
    <div class="card" id="mk"><h2>Новый урок</h2>
      <label>Тема урока</label><input id="mkT" maxlength="60" placeholder="Например, Математика, 10Б">
      <button class="btn" id="mkGo">Создать и начать</button></div>
    <div class="card"><h2>Войти по коду</h2>
      <label>Код урока</label><input id="joinC" maxlength="12" placeholder="код от преподавателя">
      <button class="btn" id="joinGo">Присоединиться</button></div>
    <div class="card" id="myBox"><h2>Мои уроки</h2><div id="myList"></div></div>
  </div>
</section>

<!-- ЗВОНОК -->
<section id="call" class="screen hidden">
  <div class="top"><b id="cTitle"></b><span class="tag" id="cTime">00:00</span>
    <span class="tag" id="cCode" style="cursor:pointer" title="Скопировать код"></span></div>
  <main>
    <div id="grid"></div>
    <aside id="side" class="hidden">
      <h2>Участники</h2><div id="people"></div>
      <div id="msgs"></div>
      <form id="cf"><input id="ci" maxlength="500" placeholder="Сообщение" autocomplete="off"><button class="btn sm" data-i="send" data-s="16"></button></form>
    </aside>
  </main>
  <div class="bar">
    <button class="cb" id="bMic" title="Микрофон"></button>
    <button class="cb" id="bCam" title="Камера"></button>
    <button class="cb" id="bScr" title="Демонстрация экрана" data-i="monitor"></button>
    <button class="cb" id="bHand" title="Поднять руку" data-i="hand"></button>
    <button class="cb" id="bSide" title="Чат и участники" data-i="chat"></button>
    <button class="cb" id="bMute" title="Выключить микрофоны всем" data-i="users"></button>
    <button class="cb end" id="bEnd" title="Выйти" data-i="logout"></button>
  </div>
</section>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,addDoc,collection,onSnapshot,deleteDoc,updateDoc,query,orderBy,limit,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1. ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ FIREBASE (Project settings → Your apps → Web) ===== */
const firebaseConfig={apiKey:"ВАШ_API_KEY",authDomain:"ВАШ_ПРОЕКТ.firebaseapp.com",projectId:"ВАШ_ПРОЕКТ",appId:"ВАШ_APP_ID"};
/* Для сетей, где прямое соединение не проходит, добавьте TURN-сервер: {urls:'turn:...',username:'',credential:''} */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};

const $=s=>document.querySelector(s),app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const P={
mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
video:'<path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
hand:'<path d="M18 11V6a2 2 0 0 0-4 0v1M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'};
P['mic-off']=P.mic+'<path d="m2 2 20 20"/>';P['video-off']=P.video+'<path d="m2 2 20 20"/>';
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||22));

let user,profile,pending,regMode=false,roomId,room,local,camTrack,pRef,pcs={},tiles={},unsubs=[],timers=[],joinT,sharing=false,hand=false,unread=false;
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('hidden',s.id!==id));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),3500)};
const ERR={'auth/email-already-in-use':'Этот email уже зарегистрирован','auth/invalid-credential':'Неверный email или пароль','auth/invalid-email':'Некорректный email','auth/weak-password':'Пароль слишком короткий','auth/missing-password':'Введите пароль','name':'Введите имя','auth/network-request-failed':'Нет сети'};

/* ===== АККАУНТЫ ===== */
const setMode=r=>{regMode=r;$('#tL').classList.toggle('on',!r);$('#tR').classList.toggle('on',r);$('#regOnly').classList.toggle('hidden',!r);$('#aGo').textContent=r?'Создать аккаунт':'Войти'};
$('#tL').onclick=()=>setMode(false);$('#tR').onclick=()=>setMode(true);
$('#aGo').onclick=async()=>{
  $('#aErr').textContent='';const e=$('#aMail').value.trim(),p=$('#aPass').value;
  try{
    if(regMode){
      const n=$('#aName').value.trim();if(!n)throw{code:'name'};
      pending={name:n,role:$('#aRole').value};
      const c=await createUserWithEmailAndPassword(auth,e,p);
      await updateProfile(c.user,{displayName:n});
      await setDoc(doc(db,'users',c.user.uid),{...pending,email:e,created:serverTimestamp()});
    }else await signInWithEmailAndPassword(auth,e,p);
  }catch(x){pending=null;$('#aErr').textContent=ERR[x.code]||('Ошибка: '+(x.code||x.message))}
};
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  user=u;if(!u){show('auth');return}
  let d=pending;pending=null;
  if(!d)try{d=(await getDoc(doc(db,'users',u.uid))).data()}catch(e){}
  profile=d||{name:u.displayName||'Гость',role:'student'};
  $('#hi').textContent=profile.name;$('#roleTag').textContent=profile.role==='teacher'?'Преподаватель':'Студент';
  const t=profile.role==='teacher';$('#mk').classList.toggle('hidden',!t);$('#myBox').classList.toggle('hidden',!t);
  show('home');if(t)loadRooms();
});

/* ===== УРОКИ ===== */
async function loadRooms(){
  const box=$('#myList');box.textContent='Загрузка…';
  try{
    const s=await getDocs(query(collection(db,'rooms'),where('owner','==',user.uid)));
    const rows=s.docs.filter(d=>!d.data().ended).sort((a,b)=>(b.data().created?.seconds||0)-(a.data().created?.seconds||0));
    box.innerHTML=rows.length?'':'<span class="sub">Пока нет активных уроков</span>';
    rows.forEach(d=>{
      const r=document.createElement('div');r.className='lesson';
      const t=document.createElement('span');t.textContent=d.data().title;
      const c=document.createElement('code');c.textContent=d.id;
      const b=document.createElement('button');b.className='btn sm';b.textContent='Войти';b.onclick=()=>enter(d.id);
      r.append(t,c,b);box.append(r);
    });
  }catch(e){box.textContent='Не удалось загрузить: '+(e.code||e.message)}
}
$('#mkGo').onclick=async()=>{
  const title=$('#mkT').value.trim()||'Урок';
  const id=Math.random().toString(36).slice(2,10);
  try{await setDoc(doc(db,'rooms',id),{title,owner:user.uid,ownerName:profile.name,ended:false,created:serverTimestamp()});enter(id)}
  catch(e){toast('Не удалось создать урок: '+(e.code||e.message))}
};
$('#joinGo').onclick=()=>enter($('#joinC').value);
$('#joinC').onkeydown=e=>{if(e.key==='Enter')enter($('#joinC').value)};

/* ===== WebRTC: сигналы через Firestore ===== */
const sig=()=>collection(db,'rooms',roomId,'signals');
const send=(to,type,data)=>addDoc(sig(),{from:user.uid,to,type,data:JSON.stringify(data),t:Date.now()}).catch(()=>{});
async function handle(from,type,d){
  const pc=getPc(from);
  try{
    if(type==='offer'){await pc.setRemoteDescription(d);await flush(pc);await pc.setLocalDescription(await pc.createAnswer());send(from,'answer',pc.localDescription)}
    else if(type==='answer'){await pc.setRemoteDescription(d);await flush(pc)}
    else if(type==='ice'){pc.remoteDescription?await pc.addIceCandidate(d):pc._q.push(d)}
  }catch(e){console.warn(e)}
}
async function flush(pc){for(const c of pc._q.splice(0))try{await pc.addIceCandidate(c)}catch(e){}}
function getPc(uid){
  if(pcs[uid])return pcs[uid];
  const pc=new RTCPeerConnection(ICE);pc._q=[];pcs[uid]=pc;
  ['audio','video'].forEach(k=>{
    const t=local.getTracks().find(x=>x.kind===k);
    t?pc.addTrack(t,local):pc.addTransceiver(k,{direction:'sendrecv'});
  });
  pc.onicecandidate=e=>e.candidate&&send(uid,'ice',e.candidate);
  pc.ontrack=e=>{const t=tile(uid);t.v.srcObject=e.streams[0]||new MediaStream([e.track]);t.v.play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')try{pc.restartIce()}catch(e){}};
  return pc;
}
async function callPeer(uid){const pc=getPc(uid);await pc.setLocalDescription(await pc.createOffer());send(uid,'offer',pc.localDescription)}

/* ===== Плитки ===== */
function tile(id){
  if(tiles[id])return tiles[id];
  const el=document.createElement('div');el.className='tile'+(id==='me'?' me':'');
  el.innerHTML='<video autoplay playsinline></video><div class="ava"><i></i></div><div class="nm"><span class="hand hidden"></span><span class="mut hidden"></span><span class="n"></span></div>';
  el.querySelector('.hand').innerHTML=ic('hand',14);el.querySelector('.mut').innerHTML=ic('mic-off',14);
  const v=el.querySelector('video');if(id==='me')v.muted=true;
  $('#grid').append(el);
  return tiles[id]={el,v,n:el.querySelector('.n'),h:el.querySelector('.hand'),m:el.querySelector('.mut'),a:el.querySelector('.ava i')};
}
function label(id,d){
  const t=tile(id);t.n.textContent=d.name+(id==='me'?' (вы)':'');
  t.a.textContent=(d.name||'?').trim().charAt(0).toUpperCase();
  t.h.classList.toggle('hidden',!d.hand);t.m.classList.toggle('hidden',d.mic!==false);
  t.el.classList.toggle('nocam',d.cam===false&&!d.sharing);t.el.classList.toggle('sp',!!d.sharing);
}
function drop(id){if(pcs[id]){pcs[id].close();delete pcs[id]}if(tiles[id]){tiles[id].el.remove();delete tiles[id]}}

/* ===== Вход в урок ===== */
async function enter(id){
  id=(id||'').trim().toLowerCase();if(!id)return;
  let r;try{r=await getDoc(doc(db,'rooms',id))}catch(e){toast('Ошибка доступа: '+(e.code||e.message));return}
  if(!r.exists()||r.data().ended){toast('Урок не найден или уже завершён');return}
  roomId=id;room=r.data();joinT=Date.now();
  try{local=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){try{local=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e2){local=new MediaStream();toast('Нет доступа к камере и микрофону — вы в режиме просмотра')}}
  camTrack=local.getVideoTracks()[0];const aT=local.getAudioTracks()[0];
  const isT=room.owner===user.uid;
  $('#cTitle').textContent=room.title;$('#cCode').textContent='Код: '+id;$('#bMute').classList.toggle('hidden',!isT);
  $('#bMic').disabled=!aT;$('#bCam').disabled=!camTrack;btns();
  show('call');tile('me').v.srcObject=local;
  pRef=doc(db,'rooms',id,'participants',user.uid);

  // 1) слушаем сигналы (до регистрации участника, чтобы не пропустить оффер)
  unsubs.push(onSnapshot(query(sig(),where('to','==',user.uid)),s=>s.docChanges().forEach(c=>{
    if(c.type!=='added')return;const m=c.doc.data();deleteDoc(c.doc.ref).catch(()=>{});
    if(m.t<joinT-5000)return;handle(m.from,m.type,JSON.parse(m.data));
  })));
  // 2) участники
  unsubs.push(onSnapshot(collection(db,'rooms',id,'participants'),s=>{
    s.docChanges().forEach(c=>{
      const d=c.doc.data(),uid=c.doc.id;
      if(uid===user.uid){label('me',d);if(d.muted&&aT&&aT.enabled){aT.enabled=false;btns();upd({mic:false,muted:false});toast('Преподаватель выключил микрофоны')}return}
      if(c.type==='removed'||Date.now()-(d.seen||0)>60000){drop(uid);return}
      label(uid,d);if(!pcs[uid]&&user.uid<uid)callPeer(uid).catch(console.warn);
    });
    const ps=s.docs.filter(x=>Date.now()-(x.data().seen||0)<60000);
    $('#people').innerHTML='';ps.forEach(x=>{const d=x.data(),e=document.createElement('div');
      e.textContent=d.name+(d.role==='teacher'?' · преподаватель':'');if(d.hand){const h=document.createElement('span');h.className='hand';h.innerHTML=ic('hand',14);e.prepend(h)}$('#people').append(e)});
  }));
  // 3) чат (хранится в Firestore)
  unsubs.push(onSnapshot(query(collection(db,'rooms',id,'messages'),orderBy('t'),limit(200)),s=>s.docChanges().forEach(c=>{
    if(c.type!=='added')return;const m=c.doc.data(),el=document.createElement('div');el.className='m';
    const sm=document.createElement('small');sm.textContent=m.uid===user.uid?'Вы':m.name;el.append(sm,document.createTextNode(m.text));
    $('#msgs').append(el);$('#msgs').scrollTop=1e9;
    if(m.uid!==user.uid&&$('#side').classList.contains('hidden')){unread=true;btns()}
  })));
  // 4) преподаватель завершил урок
  unsubs.push(onSnapshot(doc(db,'rooms',id),s=>{if(s.data()?.ended&&!isT)leave('Урок завершён преподавателем')}));

  await setDoc(pRef,{name:profile.name,role:profile.role,hand:false,mic:!!aT&&aT.enabled,cam:!!camTrack,sharing:false,muted:false,seen:Date.now(),joinedAt:serverTimestamp()});
  timers.push(setInterval(()=>upd({seen:Date.now()}),20000));
  timers.push(setInterval(()=>{const s=Math.floor((Date.now()-joinT)/1000);$('#cTime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000));
}
const upd=p=>updateDoc(pRef,p).catch(()=>{});
async function leave(msg){
  unsubs.forEach(u=>u());unsubs=[];timers.forEach(clearInterval);timers=[];
  if(pRef)await deleteDoc(pRef).catch(()=>{});pRef=null;
  Object.keys(pcs).forEach(drop);Object.keys(tiles).forEach(k=>{tiles[k].el.remove();delete tiles[k]});
  local&&local.getTracks().forEach(t=>t.stop());
  $('#msgs').innerHTML='';$('#side').classList.add('hidden');sharing=hand=unread=false;
  show('home');if(profile.role==='teacher')loadRooms();if(msg)toast(msg);
}
addEventListener('pagehide',()=>{if(pRef)deleteDoc(pRef)});

/* ===== Кнопки ===== */
function btns(){
  const a=local&&local.getAudioTracks()[0],v=camTrack;
  const set=(b,i,on)=>{b.innerHTML=ic(i);b.classList.toggle('off',on===false);};
  set($('#bMic'),a&&a.enabled?'mic':'mic-off',a&&a.enabled);
  set($('#bCam'),v&&v.enabled?'video':'video-off',v&&v.enabled);
  $('#bScr').classList.toggle('on',sharing);$('#bHand').classList.toggle('on',hand);$('#bSide').classList.toggle('on',unread);
}
$('#bMic').onclick=()=>{const t=local.getAudioTracks()[0];t.enabled=!t.enabled;btns();upd({mic:t.enabled})};
$('#bCam').onclick=()=>{camTrack.enabled=!camTrack.enabled;btns();upd({cam:camTrack.enabled})};
$('#bHand').onclick=()=>{hand=!hand;btns();upd({hand})};
$('#bSide').onclick=()=>{$('#side').classList.toggle('hidden');unread=false;btns()};
$('#bEnd').onclick=async()=>{
  if(room.owner===user.uid&&confirm('Завершить урок для всех? (Отмена — выйти только самому)'))
    await updateDoc(doc(db,'rooms',roomId),{ended:true}).catch(()=>{});
  leave();
};
$('#bMute').onclick=async()=>{
  const s=await getDocs(collection(db,'rooms',roomId,'participants'));
  s.docs.filter(d=>d.id!==user.uid).forEach(d=>updateDoc(d.ref,{muted:true}).catch(()=>{}));toast('Микрофоны студентов выключены');
};
const swap=async tr=>{for(const pc of Object.values(pcs)){const x=pc.getTransceivers().find(x=>x.receiver.track&&x.receiver.track.kind==='video');if(x)await x.sender.replaceTrack(tr).catch(()=>{})}};
async function share(){
  if(sharing){await swap(camTrack||null);tile('me').v.srcObject=local;sharing=false;btns();upd({sharing:false});return}
  try{
    const ds=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false}),st=ds.getVideoTracks()[0];
    await swap(st);tile('me').v.srcObject=ds;sharing=true;btns();upd({sharing:true});
    st.onended=()=>sharing&&share();
  }catch(e){toast('Демонстрация экрана недоступна')}
}
$('#bScr').onclick=share;
$('#cf').onsubmit=e=>{
  e.preventDefault();const v=$('#ci').value.trim();if(!v)return;$('#ci').value='';
  addDoc(collection(db,'rooms',roomId,'messages'),{uid:user.uid,name:profile.name,text:v,t:serverTimestamp()}).catch(()=>toast('Сообщение не отправлено'));
};
$('#cCode').onclick=()=>navigator.clipboard?.writeText(roomId).then(()=>toast('Код скопирован'));
</script>
</body>
</html>
